<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover | Wicket</title>
<style>
@font-face{font-family:"Geist";src:url(/_wicket/ui/fonts/geist.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Instrument Serif";src:url(/_wicket/ui/fonts/instrument-serif-italic.woff2) format("woff2");font-style:italic}
*{box-sizing:border-box;margin:0}
html,body{width:1000px;height:420px;background:#000;overflow:hidden}
body{font-family:"Geist",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(248,113,113,.16),rgba(0,0,0,0) 65%)}
.kicker{position:absolute;left:56px;top:40px;font-size:15px;color:#71717a;letter-spacing:.02em}
h1{position:absolute;left:56px;top:68px;font-size:54px;line-height:1.04;font-weight:500;letter-spacing:-.035em;width:560px}
h1 em{font-family:"Instrument Serif",serif;font-weight:400;font-size:1.1em;letter-spacing:-.015em;color:#f87171}
.chart{position:absolute;left:56px;right:56px;top:238px}
.axis{position:relative;margin-left:230px;height:2px;background:#27272a}
.tick{position:absolute;top:-4px;width:1px;height:10px;background:#3f3f46}
.tl{position:absolute;top:14px;transform:translateX(-50%);font-size:12px;color:#71717a;white-space:nowrap}
.rows{margin-top:30px}
.row{display:flex;align-items:center;height:28px;margin-bottom:8px}
.who{flex:none;width:230px;font-size:15px;color:#d4d4d8}
.who small{color:#71717a;font-size:12px;margin-left:6px}
.lane{position:relative;flex:1;height:28px}
.bar{position:absolute;left:0;top:3px;height:22px;border-radius:0 6px 6px 0;background:linear-gradient(90deg,rgba(248,113,113,.9),rgba(248,113,113,.35));display:flex;align-items:center;padding-left:12px;font-size:13px;font-weight:500;color:#000;white-space:nowrap}
.bar.none{background:none;color:#4ade80;padding-left:12px}
.dot{position:absolute;left:-5px;top:9px;width:10px;height:10px;border-radius:50%;background:#fafafa}
.zero{z-index:2;position:absolute;left:230px;top:-34px;bottom:-6px;width:1px;background:#fafafa}
.zero span{position:absolute;top:0;left:8px;font-size:13px;font-weight:500;white-space:nowrap}
</style>
</head>
<body>
<div class="glow"></div>
<div class="kicker">Authorization at the edge, measured on a deployed Worker</div>
<h1>You removed them.<br><em>Who still says yes?</em></h1>
<div class="chart">
  <div class="zero"><span>You press remove</span></div>
  <div class="axis" style="width:640px">
    <i class="tick" style="left:0"></i><i class="tick" style="left:107px"></i><i class="tick" style="left:213px"></i><i class="tick" style="left:320px"></i><i class="tick" style="left:427px"></i><i class="tick" style="left:533px"></i><i class="tick" style="left:640px"></i>
    <span class="tl" style="left:14px">0 s</span><span class="tl" style="left:107px">5 s</span><span class="tl" style="left:213px">10 s</span><span class="tl" style="left:320px">15 s</span><span class="tl" style="left:427px">20 s</span><span class="tl" style="left:533px">25 s</span><span class="tl" style="left:640px">30 s</span>
  </div>
  <div class="rows">
    <div class="row"><div class="who">Durable Object<small>decides</small></div><div class="lane"><i class="dot"></i><div class="bar none" style="width:300px">No, after 0.21 s</div></div></div>
    <div class="row"><div class="who">Memory of one Worker</div><div class="lane" style="width:640px;flex:none"><div class="bar" style="width:107px">yes, up to 5 s</div></div></div>
    <div class="row"><div class="who">Cache of one data center</div><div class="lane" style="width:640px;flex:none"><div class="bar" style="width:640px">yes, 29.4 s</div></div></div>
  </div>
</div>
</body>
</html>
